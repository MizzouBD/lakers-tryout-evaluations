<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Lakers Eval App</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --navy:#1B4D80;
  --navy2:#2C6BA3;
  --amber:#FDB927;
  --amber-dark:#DB9B10;
  --court:#EEF5FA;
  --line:#CFE1EE;
  --ink:#132A42;
  --sub:#5C7893;
  --green:#2F7A4D;
  --white:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html,body{overflow-x:hidden;}
body{
  background:var(--court);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  background:var(--white);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow-x:hidden;
}

/* Header */
.topbar{
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy2) 100%);
  color:#fff;
  padding:16px 18px 14px;
  position:relative;
  overflow:hidden;
}
.topbar::after{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px);
  pointer-events:none;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.brand{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  letter-spacing:0.03em;
  font-size:15px;
  text-transform:uppercase;
  color:var(--amber);
}
.brand small{display:block;font-family:'Inter';font-weight:500;color:#B9C2D6;font-size:11px;letter-spacing:0.02em;text-transform:none;margin-top:1px;}
.evaluator-pill{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:20px;
  padding:6px 12px;
  font-size:12.5px;
  font-weight:600;
  color:#fff;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}
.evaluator-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);}
.back-btn{
  background:none;border:none;color:#fff;font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:4px;cursor:pointer;padding:4px 2px;
  font-family:'Inter';
}
.back-btn svg{width:18px;height:18px;}

.page-title{
  font-family:'Oswald',sans-serif;
  font-size:22px;
  font-weight:700;
  margin:14px 0 0;
  position:relative;z-index:1;
  letter-spacing:0.01em;
}
.page-sub{font-size:12.5px;color:#B9C2D6;margin-top:3px;position:relative;z-index:1;}

/* Content */
.content{flex:1;padding:16px 16px 100px;}

/* Screen: name entry */
.hero{
  text-align:center;
  padding:36px 20px 10px;
}
.hero .ball{
  font-size:44px;
  margin-bottom:10px;
}
.hero h1{
  font-family:'Oswald',sans-serif;
  font-size:26px;
  margin:0 0 6px;
  color:var(--navy);
}
.hero p{color:var(--sub);font-size:14px;margin:0 0 26px;line-height:1.5;}

.field-label{
  font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;
  color:var(--sub);margin-bottom:8px;display:block;
}
input[type=text], input[type=number], select, textarea{
  width:100%;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:13px 14px;
  font-size:16px;
  font-family:'Inter';
  color:var(--ink);
  background:var(--white);
  outline:none;
}
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus{
  border-color:var(--amber);
}
.btn{
  display:block;
  width:100%;
  text-align:center;
  border:none;
  border-radius:12px;
  padding:15px 18px;
  font-size:15.5px;
  font-weight:700;
  font-family:'Inter';
  cursor:pointer;
  letter-spacing:0.01em;
}
.btn-primary{background:var(--amber);color:#fff;}
.btn-primary:active{background:var(--amber-dark);}
.btn-primary:disabled{background:#E7C393;cursor:default;}
.btn-secondary{background:var(--court);color:var(--navy);border:1.5px solid var(--line);}
.btn-ghost{background:none;color:var(--navy);text-decoration:underline;padding:10px;font-weight:600;}
.spacer-16{height:16px;}
.spacer-24{height:24px;}

/* Group grid */
.section-label{
  font-family:'Oswald',sans-serif;
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--sub);
  margin:22px 0 10px;
}
.section-label:first-child{margin-top:0;}
.group-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.group-card{
  background:var(--white);
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:14px 14px 12px;
  cursor:pointer;
  text-align:left;
  position:relative;
}
.group-card:active{border-color:var(--amber);}
.group-card .g-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:15.5px;color:var(--navy);}
.group-card .g-progress{font-size:11.5px;color:var(--sub);margin-top:6px;}
.group-card .g-bar{
  height:5px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden;
}
.group-card .g-bar-fill{height:100%;background:var(--green);border-radius:4px;}

/* Roster list */
.search-box{position:relative;margin-bottom:14px;}
.search-box input{padding-left:38px;}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--sub);}

.roster-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.roster-item:active{background:var(--court);}
.jersey{
  width:38px;height:38px;border-radius:50%;
  background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;
  flex-shrink:0;
}
.jersey.blank{background:var(--line);color:var(--sub);}
.roster-name{flex:1;min-width:0;}
.roster-name .rn-main{font-weight:600;font-size:15px;color:var(--ink);}
.roster-name .rn-sub{font-size:12.5px;color:var(--navy);font-weight:600;margin-top:2px;}
.roster-name .rn-sub.no-rating{color:var(--sub);font-weight:500;font-style:italic;}
.roster-status{flex-shrink:0;}
.status-bubble{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--line);
  transition:background 0.15s;
}
.status-bubble.has-feedback{background:var(--green);}
.status-bubble svg{width:14px;height:14px;color:#fff;opacity:0;}
.status-bubble.has-feedback svg{opacity:1;}
.rn-main .new-tag{
  display:inline-block;
  background:var(--amber);
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:0.04em;
  padding:2px 6px;
  border-radius:5px;
  vertical-align:middle;
  margin-left:4px;
}

/* Eval form */
.player-header{
  display:flex;align-items:center;gap:10px;
  padding-bottom:10px;margin-bottom:2px;border-bottom:1px solid var(--line);
}
.player-header .jersey{width:38px;height:38px;font-size:14px;background:var(--amber);}
.player-header .ph-name{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;color:var(--navy);}
.player-header .ph-sub{font-size:11.5px;color:var(--sub);margin-top:1px;}

.skill-block{margin:10px 0;}
.skill-block .sk-label{font-weight:700;font-size:12px;color:var(--ink);margin-bottom:5px;display:block;}
.rate-row{display:flex;gap:5px;}
.rate-btn{
  flex:1;
  height:32px;
  border:1.5px solid var(--line);
  background:var(--white);
  border-radius:8px;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:12px;
  color:var(--sub);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.rate-btn.sel{background:var(--navy);border-color:var(--navy);color:#fff;}

.grade-row{display:flex;flex-wrap:wrap;gap:5px;}
.grade-btn{
  flex:1 1 30%;
  border:1.5px solid var(--line);
  background:var(--white);
  border-radius:8px;
  padding:7px 3px;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:11.5px;
  color:var(--sub);
  cursor:pointer;
  text-align:center;
}
.grade-btn.sel{background:var(--amber);border-color:var(--amber);color:#fff;}

.overall-block{
  margin:12px 0 16px;
  padding:12px;
  background:var(--court);
  border-radius:12px;
}
.overall-block .sk-label{margin-bottom:7px;}
.grade-row-single{display:flex;flex-wrap:nowrap;gap:3px;overflow:hidden;}
.grade-row-single .grade-btn{flex:1 1 0;min-width:0;padding:8px 1px;font-size:10.5px;}
.rate-row-single{display:flex;flex-wrap:nowrap;gap:5px;}
.rate-row-single .rate-btn{flex:1;height:34px;font-size:13px;}
.overall-caption{font-size:10.5px;color:var(--sub);margin-top:7px;line-height:1.4;text-align:center;}

.day-toggle{display:flex;gap:8px;margin-bottom:16px;}
.day-toggle button{
  flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--white);font-weight:700;font-size:13.5px;color:var(--sub);
  font-family:'Inter';cursor:pointer;
}
.day-toggle button.sel{background:var(--navy);border-color:var(--navy);color:#fff;}

textarea{min-height:50px;resize:vertical;font-family:'Inter';font-size:14px;padding:9px 12px;}

.save-bar{
  position:sticky;bottom:0;
  background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 30%, #fff 60%);
  padding:18px 16px 16px;
  margin:0 -16px;
}
.save-note{font-size:11.5px;color:var(--sub);text-align:center;margin-top:8px;}

/* Export screen */
.export-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px;border-bottom:1px solid var(--line);
}
.export-row .er-name{font-weight:600;font-size:14.5px;}
.export-row .er-count{font-size:12.5px;color:var(--sub);}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:30px;
  font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.2);
  z-index:100;opacity:0;pointer-events:none;transition:opacity 0.25s, transform 0.25s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.empty-state{text-align:center;padding:60px 20px;color:var(--sub);}
.empty-state svg{width:40px;height:40px;margin-bottom:12px;opacity:0.4;}

.loading{text-align:center;padding:40px;color:var(--sub);font-size:14px;}

.last-edited{
  background:var(--court);
  border-radius:7px;
  padding:6px 10px;
  font-size:11px;
  color:var(--sub);
  margin:8px 0 2px;
}
.last-edited strong{color:var(--ink);}

.summary-section{margin-bottom:22px;}
.summary-title{
  font-family:'Oswald',sans-serif;
  font-size:14.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.05em;
  padding:9px 12px;
  border-radius:8px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.summary-title.st-gold{background:var(--amber);color:#3A2A00;}
.summary-title.st-blue{background:var(--navy);color:#fff;}
.summary-title.st-white{background:var(--white);color:var(--navy);border:1.5px solid var(--line);}
.summary-title.st-waitlist{background:#B4400C;color:#fff;}
.summary-title.st-unrated{background:var(--court);color:var(--sub);border:1.5px solid var(--line);}
.summary-count{
  font-family:'Inter';font-size:11.5px;font-weight:700;
  background:rgba(0,0,0,0.12);
  border-radius:10px;padding:2px 8px;
}
.summary-title.st-white .summary-count, .summary-title.st-unrated .summary-count{background:var(--court);color:var(--sub);}
.summary-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 4px;
  border-bottom:1px solid var(--line);
}
.summary-row:last-child{border-bottom:none;}
.summary-info{flex:1;min-width:0;}
.sr-name{font-weight:600;font-size:14.5px;color:var(--ink);}
.sr-sub{font-size:11.5px;color:var(--sub);margin-top:1px;}
.sr-rating{
  flex-shrink:0;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:13px;
  color:var(--navy);
  background:var(--court);
  border-radius:7px;
  padding:5px 9px;
}

::selection{background:var(--amber);color:#fff;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
</style>
</head>

function recoverDraft(){try{const d=JSON.parse(localStorage.getItem('lakers_eval_draft_v3')||'null');if(d&&d.evaluator&&d.formData&&!d.formData.updatedAt)return d}catch(e){}return null}
function icon(name){
  const icons = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>',
    empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8 15c1 1 2 1.5 4 1.5s3-.5 4-1.5"/></svg>'
  };
  return icons[name]||'';
}

function groupProgress(group){
  const roster=ROSTER[group].players;
  const done=roster.filter(p=>!!getMyEval(playerId(p))?.updatedAt).length;
  const consensus=roster.filter(p=>countPlayerEvals(playerId(p))>0).length;
  return {done,total:roster.length,consensus};
}

function escapeHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
function render(){
 const app=document.getElementById('app');let html='';
 if(state.screen==='login')html=renderLogin();
 else if(state.screen==='admin')html=renderAdmin();
 else if(state.screen==='setup')html=renderSetup();
 else if(state.screen==='groups')html=renderGroups();
 else if(state.screen==='roster')html=renderRoster();
 else if(state.screen==='form')html=renderForm();
 else if(state.screen==='export')html=renderExport();
 else if(state.screen==='summaryGroups')html=renderSummaryGroups();
 else if(state.screen==='summary')html=renderSummary();
 app.innerHTML=html;attachHandlers();
}
function renderLogin(){
 return `<div class="topbar"><div class="topbar-row"><div class="brand">LAKERS EVAL APP<small>2026–27 Season</small></div></div><div class="page-title">Secure evaluator sign-in</div><div class="page-sub">Firebase authentication · private tryout data</div></div>
 <div class="content"><div class="hero"><div class="ball">🏀</div><h1>Let's get scoring</h1><p>Sign in with the email and password assigned to you. You can enter the name you want shown on evaluations, or leave it blank to use your sign-in email.</p></div>
 <label class="field-label">Email</label><input id="login-email" type="email" autocomplete="username" placeholder="you@example.com">
 <div class="spacer-16"></div><label class="field-label">Password</label><input id="login-password" type="password" autocomplete="current-password" placeholder="Password">
 <div class="spacer-16"></div><label class="field-label">Name shown on evaluations <span style="font-weight:400;color:var(--sub)">(optional)</span></label><input id="login-display-name" type="text" autocomplete="name" placeholder="Leave blank to use sign-in email">
 <div class="spacer-16"></div><button class="btn btn-primary" id="login-btn">Sign in</button>
 <div class="spacer-16"></div><div id="login-status" style="font-size:12px;color:var(--sub);text-align:center;">${escapeHtml(state.dbStatus)}</div></div>`;
}

function renderSetup(){return `<div class="topbar"><div class="topbar-row"><button class="back-btn" id="back-from-setup">${icon('back')} Back</button></div><div class="page-title">Firebase status</div><div class="page-sub">Authenticated connection</div></div><div class="content"><p style="font-size:13.5px;color:var(--sub);line-height:1.6;">This app is configured for the Lakers Firebase project. Authentication is required; no anonymous access is used.</p><div style="padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8fbfd;"><b>${escapeHtml(state.user?.email||'Not signed in')}</b><div style="font-size:12px;color:var(--sub);margin-top:5px;">Role: ${escapeHtml(state.role||'—')} · Status: ${escapeHtml(state.dbStatus)}</div></div><div class="spacer-16"></div><button class="btn btn-secondary" id="signout-btn">Sign out</button></div>`}
function renderAdmin(){
 return `<div class="topbar"><div class="topbar-row"><div class="brand">LAKERS EVAL APP<small>2026–27 Season</small></div><div class="evaluator-pill"><span class="dot"></span>Admin</div></div><div class="page-title">Admin Mode</div><div class="page-sub">Roster, accounts, backup and live status</div></div>
 <div class="content"><div style="padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8fbfd;"><b>Signed in:</b> ${escapeHtml(state.user?.email||'')}<div style="font-size:12px;color:var(--sub);margin-top:5px;">${escapeHtml(state.dbStatus)}</div></div>
 <div class="spacer-16"></div><button class="btn btn-primary" id="admin-roster">Open evaluation groups</button>
 <div class="spacer-12"></div><button class="btn btn-secondary" id="publish-roster">Publish current roster to Firebase</button>
 <div class="spacer-12"></div><button class="btn btn-secondary" id="admin-export">Export all evaluations</button>
 <div class="spacer-24"></div><div class="section-label">Add evaluator mapping</div>
 <p style="font-size:12px;color:var(--sub);line-height:1.5;">Create the evaluator's Email/Password account in Firebase Authentication first. Then paste that account's UID here and assign one key: Girls 1–8 or Boys 1–8. The reviewer can choose a display name at sign-in or leave it blank to use the sign-in email.</p>
 <label class="field-label">Firebase User UID</label><input id="new-uid" placeholder="Paste evaluator UID">
 <div class="spacer-12"></div><label class="field-label">Evaluator key</label><select id="new-evaluator"><option value="">Select…</option>${[...GIRLS_EVALUATORS,...BOYS_EVALUATORS].map(x=>`<option>${x}</option>`).join('')}</select>
 <div class="spacer-12"></div><button class="btn btn-secondary" id="save-evaluator">Save evaluator mapping</button>
 <div class="spacer-24"></div><button class="btn btn-ghost" id="firebase-status">Firebase connection details</button><div class="spacer-12"></div><button class="btn btn-ghost" id="signout-btn">Sign out</button></div>`;
}
function renderGroups(){
 const groups=GROUP_ORDER.filter(g=>state.role==='admin'||(state.side==='girls'?g.startsWith('Girls'):g.startsWith('Boys')));
 return `<div class="topbar"><div class="topbar-row"><div class="brand">LAKERS EVAL APP<small>2026–27 Season</small></div><div class="evaluator-pill" id="change-evaluator"><span class="dot"></span>${escapeHtml(state.evaluator)}</div></div><div class="page-title">Pick a group</div><div class="page-sub">${state.role==='admin'?'All groups':sideLabel()+' groups only'}</div></div><div class="content"><div class="group-grid">${groups.map(g=>`<button class="group-card" data-group="${g}"><div class="g-name">${g}</div><div class="g-progress">${ROSTER[g].players.length} players · ${groupProgress(g).done} mine · ${groupProgress(g).consensus} shared</div></button>`).join('')}</div><div class="spacer-24"></div><button class="btn btn-secondary" id="go-summary">View Team Summary</button><div class="spacer-16"></div><button class="btn btn-ghost" id="go-export">Export all data (CSV)</button>${state.role==='admin'?'<div class="spacer-16"></div><button class="btn btn-ghost" id="back-admin">Back to Admin Mode</button>':''}</div>`;
}
function attachHandlers(){
 const $=id=>document.getElementById(id);
 $('login-btn')?.addEventListener('click',async()=>{const email=$('login-email').value.trim(),pw=$('login-password').value,displayName=$('login-display-name')?.value.trim()||'';if(!email||!pw){showToast('Enter email and password');return}window.lakersPendingDisplayName=displayName;$('login-btn').disabled=true;$('login-status').textContent='Signing in…';await signIn(email,pw)});
 $('login-password')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('login-btn')?.click()});
 $('signout-btn')?.addEventListener('click',signOut);
 $('firebase-status')?.addEventListener('click',()=>{state.screen='setup';render()});
 $('back-from-setup')?.addEventListener('click',()=>{state.screen=state.role==='admin'?'admin':'groups';render()});
 $('admin-roster')?.addEventListener('click',()=>{state.side=null;state.screen='groups';render()});
 $('back-admin')?.addEventListener('click',()=>{state.screen='admin';render()});
 $('publish-roster')?.addEventListener('click',async()=>{try{await saveRosterToServer();showToast('Roster published to Firebase')}catch(e){showToast('Roster publish failed')}})
 $('admin-export')?.addEventListener('click',()=>{state.screen='export';render()});
 $('save-evaluator')?.addEventListener('click',async()=>{const uid=$('new-uid')?.value.trim(),key=$('new-evaluator')?.value;if(!uid||!key){showToast('Enter UID and evaluator key');return}try{await firebase.database().ref(`users/${uid}`).set({role:'evaluator',evaluatorKey:key});showToast(`${key} mapping saved`);$('new-uid').value='';$('new-evaluator').value=''}catch(e){showToast('Could not save mapping')}})
 $('change-evaluator')?.addEventListener('click',()=>{if(state.role==='admin'){state.screen='admin';render()}});
 $('continue-girls')?.addEventListener('click',()=>{state.side='girls';state.screen='groups';render()});
 $('continue-boys')?.addEventListener('click',()=>{state.side='boys';state.screen='groups';render()});
 $('recover-draft')?.addEventListener('click',()=>{const d=recoverDraft();if(d){state.group=d.group;state.player=d.player;state.formData=d.formData;state.side=d.group?.startsWith('Girls')?'girls':'boys';state.screen='form';render()}});
 document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{state.group=b.dataset.group;state.screen='roster';state.search='';render()}));
 document.querySelectorAll('[data-summary-group]').forEach(b=>b.addEventListener('click',()=>{state.group=b.dataset.summaryGroup;state.screen='summary';render()}));
 document.querySelectorAll('.roster-item').forEach(b=>b.addEventListener('click',()=>{const p=ROSTER[state.group].players.find(x=>playerId(x)===b.dataset.pid);if(!p)return;state.player=p;state.formData=newFormData(state.group,p);state.screen='form';render()}));
 $('roster-search')?.addEventListener('input',e=>{state.search=e.target.value;render();const el=$('roster-search');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}});
 $('go-summary')?.addEventListener('click',()=>{state.screen='summaryGroups';render()});$('go-export')?.addEventListener('click',()=>{state.screen='export';render()});
 $('back-to-groups')?.addEventListener('click',()=>{state.screen='groups';state.search='';render()});$('back-to-groups-from-export')?.addEventListener('click',()=>{state.screen=state.role==='admin'?'admin':'groups';render()});$('back-to-groups-from-summary')?.addEventListener('click',()=>{state.screen='groups';render()});$('back-to-summary-groups')?.addEventListener('click',()=>{state.screen='summaryGroups';render()});
 $('do-export')?.addEventListener('click',runExport);
 if(state.screen==='form'){
  document.querySelectorAll('[data-field="skill"] .rate-btn').forEach(b=>b.addEventListener('click',()=>{state.formData.skills[b.parentElement.dataset.skill]=Number(b.dataset.val);state.dirty=true;autosaveDraft();render()}));
  document.querySelectorAll('[data-field="drill"] .rate-btn').forEach(b=>b.addEventListener('click',()=>{state.formData.drills[b.parentElement.dataset.drill]=Number(b.dataset.val);state.dirty=true;autosaveDraft();render()}));
  document.querySelectorAll('[data-field="gameRating"] .grade-btn').forEach(b=>b.addEventListener('click',()=>{state.formData.gameRating=b.dataset.val;state.dirty=true;autosaveDraft();render()}));
  document.querySelectorAll('[data-field="girlsRating"] .rate-btn').forEach(b=>b.addEventListener('click',()=>{state.formData.rating=Number(b.dataset.val);state.dirty=true;autosaveDraft();render()}));
  document.querySelector('textarea[data-field="feedback"]')?.addEventListener('input',e=>{state.formData.feedback=e.target.value;state.dirty=true;autosaveDraft()});
  $('save-eval')?.addEventListener('click',async()=>{const fd=state.formData;const ok=ROSTER[state.group].isBoys?(BOYS_SKILLS.every(s=>fd.skills[s]!=null)&&fd.gameRating):(GIRLS_DRILLS.every(d=>fd.drills[d]!=null)&&fd.rating!=null);if(!ok){showToast('Complete every rating before saving');return}fd.lastEditedBy=state.evaluator;await saveEval(fd);clearDraft();state.screen='roster';render()});
 }
}
window.addEventListener('beforeunload',()=>{persistLocal();autosaveDraft()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){persistLocal();autosaveDraft()}});
window.addEventListener('online',()=>{if(state.user)connectFirebase()});
render(); (async()=>{ try{await hydrateLocal(); render();}catch(e){state.dbStatus='Local backup unavailable'; render();} try{await connectFirebase();}catch(e){state.dbStatus='Firebase unavailable'; render();} })();
</script>
</body>
</html>
